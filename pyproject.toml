[project]
name = "billy-sound-bot"
version = "0.1.0"
description = "A Discord music bot with Spotify search and queued playback."
requires-python = ">=3.11"
dependencies = [
    "discord.py[voice]>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "yt-dlp>=2025.1.0",
]

[project.scripts]
billy-sound-bot = "billy_sound_bot.bot:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billy_sound_bot"]
